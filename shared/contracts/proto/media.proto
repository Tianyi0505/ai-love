syntax = "proto3";

package ailove.media;

// 定义渲染、推流与音乐协议

message AvatarCommand {
  string   ai_id      = 1;
  enum CommandType {
    COMMAND_TYPE_UNSPECIFIED = 0;
    SPEAK   = 1;
    EMOTION = 2;
    ACTION  = 3;
    IDLE    = 4;
    ENTER   = 5;
    LEAVE   = 6;
  }
  CommandType type       = 2;
  string      payload    = 3;
  int32       duration_ms = 4;
  int64       timestamp  = 5;
}

message ObsControl {
  string   action   = 1;
  map<string, string> params = 2;
}

message MusicCommand {
  string   ai_id = 1;
  enum CommandType {
    COMMAND_TYPE_UNSPECIFIED = 0;
    PLAY   = 1;
    PAUSE  = 2;
    RESUME = 3;
    STOP   = 4;
    NEXT   = 5;
    VOLUME = 6;
  }
  CommandType type   = 2;
  string      song_id = 3;
  int32       volume = 4;
  int64       timestamp = 5;
}

message ListSongsRequest {
  string ai_id = 1;
}

message SongInfo {
  string song_id = 1;
  string title   = 2;
  string artist  = 3;
  int32  duration_sec = 4;
  string file_path = 5;
}

message ListSongsResponse {
  repeated SongInfo songs = 1;
}
