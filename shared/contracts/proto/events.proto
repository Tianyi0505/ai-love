syntax = "proto3";

package ailove.events;

// 互动事件模型（第二层规范化事件，总线唯一流通形状）
// 主题：ai.events.<ai_id> | ai.events.all | ai.speech.request | avatar.command.<ai_id> | music.command.<ai_id> | live.plan.<ai_id>

enum InteractionType {
  INTERACTION_TYPE_UNSPECIFIED = 0;
  DANMAKU    = 1;
  GIFT       = 2;
  GUARD      = 3;
  ENTER      = 4;
  FOLLOW     = 5;
  SUPER_CHAT = 6;
  RAFFLE     = 7;
  LIVE_START = 8;
  LIVE_END   = 9;
}

message Viewer {
  int64  uid    = 1;
  string name   = 2;
  string title  = 3;
}

message InteractionEvent {
  string          id               = 1;
  InteractionType type             = 2;
  Viewer          actor            = 3;
  string          content          = 4;   // 弹幕内容 / 礼物名
  map<string, string> meta         = 5;   // 金额、舰长类型等
  int32           importance       = 6;   // 0-100
  string          ai_target        = 7;   // 指定AI / all / 空
  map<string, string> context_metadata = 8;
  int64           timestamp        = 9;
}

// ---- 导演计划（orchestrator ↔ ai-agent）----

message PlanStep {
  string   step_id = 1;
  string   action  = 2;   // chat / respond_gift / sing / skill ...
  string   payload = 3;   // JSON 载荷
  int32    priority = 4;
  bool     is_dynamic = 5;
}

message PlanAssignment {
  string       session_id = 1;
  repeated PlanStep steps = 2;
  string       director_notes = 3;
  int64        generated_at  = 4;
}

message PlanReport {
  string   session_id  = 1;
  string   step_id     = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    EXECUTING = 1;
    DONE      = 2;
    INTERRUPTED = 3;
    FAILED    = 4;
  }
  Status status = 3;
  string note   = 4;
}

message Interruption {
  string   session_id  = 1;
  string   step_id     = 2;
  InteractionEvent cause = 3;
  string   resume_note = 4;
}

message SpeechRequest {
  string session_id = 1;
  string ai_id      = 2;
  string text       = 3;
  int32  priority   = 4;
  map<string, string> meta  = 5;
  int64  timestamp  = 6;
}
