syntax = "proto3";

package ailove.skill;

// 技能系统协议：全局技能池 + 每 AI 白名单

message SkillInfo {
  string name        = 1;
  string description = 2;
  map<string, string> parameters = 3;
  bool   is_heavy    = 4;   // 重技能（独立子服务）
  string service     = 5;
}

message ListSkillsRequest {
  string ai_id = 1;
}

message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}

message ExecuteRequest {
  string   ai_id    = 1;
  string   skill_name = 2;
  map<string, string> arguments = 3;
  string   session_id = 4;
}

message ExecuteResponse {
  bool     ok     = 1;
  string   result = 2;
  bytes    extra  = 3;
  int64    latency_ms = 4;
}
