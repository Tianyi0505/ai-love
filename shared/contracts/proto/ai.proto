syntax = "proto3";

package ailove.ai;

// 定义大模型与语音合成协议

enum Role {
  ROLE_UNSPECIFIED = 0;
  SYSTEM    = 1;
  USER      = 2;
  ASSISTANT = 3;
  TOOL      = 4;
}

message ChatMessage {
  Role   role    = 1;
  string content = 2;
  string name    = 3;
}

message ToolCall {
  string name       = 1;
  map<string, string> arguments = 2;
}

message ChatRequest {
  string         ai_id        = 1;
  string         session_id   = 2;
  repeated ChatMessage messages = 3;
  repeated ToolCall  tools    = 4;
  map<string, string> options = 5;
}

message ChatStreamChunk {
  string ai_id       = 1;
  string content     = 2;
  string finish_reason = 3;
  ToolCall tool_call = 4;
  int64   latency_ms = 5;
}

message SynthesizeRequest {
  string ai_id   = 1;
  string text    = 2;
  string emotion = 3;
  map<string, string> options = 4;
}

message SynthesizeResponse {
  bytes  audio_pcm = 1;
  string format    = 2;
  int64  latency_ms = 3;
}
