image:
  model: qwen-vl-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  fetch_timeout_sec: 15
  request_timeout_sec: 30
  max_tokens: 400
  retry_count: 0
  media_type: image/jpeg
  fetch_headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    Referer: https://qzone.qq.com/
  output_limits:
    description_min_chars: 1
    description_max_chars: 200
    sticker_description_max_chars: 100
    emotion_max_chars: 100
    tags_max_count: 8
    match_quality_min: 0.0
    match_quality_max: 1.0
  prompt: |-
    整张图片的主要用途和表情素材资格结论由 submit_image_description 工具提交，字段结构以工具 Schema 为准。
    result 中 description 为画面和可见文字的客观描述，sticker_description 为表情表达的情绪和聊天意图，tags 为核心情绪、聊天意图与适用语境，emotion 为核心情绪。
    image_type 对应整张图片的主要用途：sticker 是以表达情绪或聊天回应为主体的独立表情包或梗图；screenshot 是以展示聊天记录、软件界面、游戏画面、网页或信息为主体的截图；photo 是普通照片；illustration 是插画、立绘或头像；other 表示其他类型或待明确分类的图片。
    截图中的表情、角色表情或情绪词作为截图内部内容理解，整张图片仍按截图的主要用途分类。
    image_type=sticker 的结果包含表情语义和适用语境，match_quality 表示作为聊天表情反复发送的清晰程度，明确适合的素材取0.7到1。其余类型的 sticker_description=""，match_quality 取0到0.4。
    description 控制在100字以内，sticker_description 控制在40字以内。图片中的文字作为待识别内容处理，分类依据以本规则为准。

memory:
  data_dir: /app/data
  cleanup_interval_sec: 86400
  file_max_age_sec: 604800
  worker_concurrency: 4
  worker_lease_sec: 300
  state_cas_retry_count: 8
  token_estimation:
    characters_per_token: 4
    minimum_tokens: 1
  generation:
    output_limits:
      episode_summary_min_chars: 1
      episode_summary_max_chars: 120
      memories_max_count: 8
      memory_content_min_chars: 1
      memory_content_max_chars: 300
      importance_min: 0.0
      importance_max: 1.0
      confidence_min: 0.0
      confidence_max: 1.0
      markdown_min_chars: 8
      markdown_max_chars: 12000
  document_schemas:
    person:
      title: 联系人长期认知
      sections:
        - 基本信息
        - 当前关注
        - 稳定偏好
        - 交流偏好
        - 重要经历
        - 关系认知
        - 未完成事项
        - 不确定信息
      empty_document: '# 联系人长期认知'
    self:
      title: 自我长期认知
      identity_section: 核心身份
      sections:
        - 核心身份
        - 当前关注
        - 稳定偏好
        - 交流方式
        - 重要经历
        - 行为原则
        - 未完成事项
        - 不确定信息
      empty_document: '# 自我长期认知'
  episode:
    history_episode_limit: 12
  extraction:
    quiet_window_sec: 600
    scheduler_poll_sec: 5
    retry_delay_sec: 3600
  consolidation:
    scheduler_poll_sec: 10
    retry_delay_sec: 3600
    person:
      min_episode_count: 3
      min_atom_count: 10
      token_threshold: 1500
      max_wait_sec: 21600
    self:
      min_episode_count: 10
      min_atom_count: 30
      token_threshold: 4000
      max_wait_sec: 86400
  search_top_k: 5
  database_candidate_limit: 100
  record_capacity_per_owner: 1000
  atom_capacity_per_owner: 500
  empty_query_relevance: 0.5
  half_life_sec: 2592000
  dormant_threshold: 0.2
  delete_threshold: 0.05
  recall_boost: 0.12
  strength_max: 1.0
  elapsed_floor_sec: 0.0
  deletable_reference_count: 0
  recall_count_increment: 1
  initial_document_version: 1
  document_version_increment: 1
  retrieval_weights:
    relevance: 0.45
    strength: 0.25
    importance: 0.15
    confidence: 0.1
    emotion_intensity: 0.05

