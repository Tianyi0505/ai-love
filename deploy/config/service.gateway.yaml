instance_addr: 127.0.0.1:0
accounts:
  - account_id: qq-main
    adapter: qq
    owner_ai_id: __AILOVE_AI_ID__
    config:
      ws_url: __NAPCAT_WS_URL__
      http_url: __NAPCAT_HTTP_URL__
      uin: __AILOVE_QQ_UIN__
      content_strategies: [quote, forward, voice, image, file, at, text]

private_reply:
  scan_interval_sec: 5
  batch_size: 100
  concurrency: 10
  processing_budget_sec: 45
  lease_sec: 120
  heartbeat_sec: 15
  send_retries: 2
