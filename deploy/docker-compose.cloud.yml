# 部署云端无头服务

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ailove-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:?}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?}
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    restart: unless-stopped
    networks: [ailove]

  nats:
    image: nats:2.10.29-alpine
    container_name: ailove-nats
    command: ["-js", "-sd", "/data", "-m", "8222", "-auth", "${AILOVE_BUS_TOKEN:?}"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    restart: unless-stopped
    networks: [ailove]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: ailove-jaeger
    ports:
      - "16686:16686"
    restart: unless-stopped
    networks: [ailove]

  redis:
    image: redis:8.2.1-alpine
    container_name: ailove-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${AILOVE_REDIS_PASSWORD:?}"]
    restart: unless-stopped
    networks: [ailove]

  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b  # PG 16.15
    container_name: ailove-postgres
    environment:
      - POSTGRES_DB=ailove
      - POSTGRES_USER=ailove
      - POSTGRES_PASSWORD=${AILOVE_POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ${AILOVE_PERSONAL_BOOTSTRAP_SQL:?}:/docker-entrypoint-initdb.d/002_bootstrap_personal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailove -d ailove"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [ailove]

  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile, target: gateway }
    image: ailove/gateway
    container_name: ailove-gateway
    volumes:
      - /opt/ailove/data:/app/data
    environment:
      - AILOVE_NACOS_ADDRS=nacos:8848
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_GRPC_TIMEOUT_MS=${AILOVE_NACOS_GRPC_TIMEOUT_MS:?}
      - AILOVE_CONFIG_RETRY_COUNT=${AILOVE_CONFIG_RETRY_COUNT:?}
      - AILOVE_CONFIG_RETRY_INTERVAL_SEC=${AILOVE_CONFIG_RETRY_INTERVAL_SEC:?}
      - AILOVE_SNOWFLAKE_WORKER_ID=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=nats://nats:4222
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
      - AILOVE_DATABASE_URL=postgresql://ailove:${AILOVE_POSTGRES_PASSWORD}@postgres:5432/ailove
      - AILOVE_DATABASE_POOL_MIN_SIZE=${AILOVE_DATABASE_POOL_MIN_SIZE:?}
      - AILOVE_DATABASE_POOL_MAX_SIZE=${AILOVE_DATABASE_POOL_MAX_SIZE:?}
      - AILOVE_DATABASE_POOL_RECYCLE_SEC=${AILOVE_DATABASE_POOL_RECYCLE_SEC:?}
      - AILOVE_DATABASE_POOL_TIMEOUT_SEC=${AILOVE_DATABASE_POOL_TIMEOUT_SEC:?}
    depends_on:
      nacos: { condition: service_started }
      nats: { condition: service_started }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [ailove]

  director:
    build: { context: .., dockerfile: deploy/Dockerfile, target: director }
    image: ailove/director
    container_name: ailove-director
    volumes:
      - /opt/ailove/data:/app/data
    environment:
      - AILOVE_NACOS_ADDRS=nacos:8848
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_GRPC_TIMEOUT_MS=${AILOVE_NACOS_GRPC_TIMEOUT_MS:?}
      - AILOVE_CONFIG_RETRY_COUNT=${AILOVE_CONFIG_RETRY_COUNT:?}
      - AILOVE_CONFIG_RETRY_INTERVAL_SEC=${AILOVE_CONFIG_RETRY_INTERVAL_SEC:?}
      - AILOVE_SNOWFLAKE_WORKER_ID=2
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=nats://nats:4222
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
    depends_on: [nacos, nats]
    restart: unless-stopped
    networks: [ailove]

  ai-agent:
    build: { context: .., dockerfile: deploy/Dockerfile, target: ai-agent }
    image: ailove/ai-agent
    volumes:
      - /opt/ailove/data:/app/data
    extra_hosts:
      - "tokendance.space:${TOKENDANCE_HOST_IP:?}"
    container_name: ailove-ai-agent
    environment:
      - AILOVE_NACOS_ADDRS=nacos:8848
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_GRPC_TIMEOUT_MS=${AILOVE_NACOS_GRPC_TIMEOUT_MS:?}
      - AILOVE_CONFIG_RETRY_COUNT=${AILOVE_CONFIG_RETRY_COUNT:?}
      - AILOVE_CONFIG_RETRY_INTERVAL_SEC=${AILOVE_CONFIG_RETRY_INTERVAL_SEC:?}
      - AILOVE_SNOWFLAKE_WORKER_ID=3
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=nats://nats:4222
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
      - AILOVE_DATABASE_URL=postgresql://ailove:${AILOVE_POSTGRES_PASSWORD}@postgres:5432/ailove
      - AILOVE_DATABASE_POOL_MIN_SIZE=${AILOVE_DATABASE_POOL_MIN_SIZE:?}
      - AILOVE_DATABASE_POOL_MAX_SIZE=${AILOVE_DATABASE_POOL_MAX_SIZE:?}
      - AILOVE_DATABASE_POOL_RECYCLE_SEC=${AILOVE_DATABASE_POOL_RECYCLE_SEC:?}
      - AILOVE_DATABASE_POOL_TIMEOUT_SEC=${AILOVE_DATABASE_POOL_TIMEOUT_SEC:?}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:?}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:?}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:?}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:?}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL:?}
      - BAILIAN_VISION_MODEL=${BAILIAN_VISION_MODEL:?}
      - AILOVE_REDIS_URL=redis://redis:6379/0
      - AILOVE_REDIS_PASSWORD=${AILOVE_REDIS_PASSWORD:?}
    depends_on:
      nacos: { condition: service_started }
      nats: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: [ailove]

  gptsovits:
    build: { context: .., dockerfile: deploy/Dockerfile, target: gptsovits }
    image: ailove/gptsovits
    container_name: ailove-gptsovits
    volumes:
      - /opt/ailove/audio:/app/data/voice
    environment:
      - AILOVE_NACOS_ADDRS=nacos:8848
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_GRPC_TIMEOUT_MS=${AILOVE_NACOS_GRPC_TIMEOUT_MS:?}
      - AILOVE_CONFIG_RETRY_COUNT=${AILOVE_CONFIG_RETRY_COUNT:?}
      - AILOVE_CONFIG_RETRY_INTERVAL_SEC=${AILOVE_CONFIG_RETRY_INTERVAL_SEC:?}
      - AILOVE_SNOWFLAKE_WORKER_ID=4
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=nats://nats:4222
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
    depends_on: [nacos, nats]
    restart: unless-stopped
    networks: [ailove]

  live-edge:
    build: { context: .., dockerfile: deploy/Dockerfile, target: live-edge }
    image: ailove/live-edge
    container_name: ailove-live-edge
    volumes:
      - /opt/ailove/data:/app/data
    environment:
      - AILOVE_NACOS_ADDRS=nacos:8848
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_GRPC_TIMEOUT_MS=${AILOVE_NACOS_GRPC_TIMEOUT_MS:?}
      - AILOVE_CONFIG_RETRY_COUNT=${AILOVE_CONFIG_RETRY_COUNT:?}
      - AILOVE_CONFIG_RETRY_INTERVAL_SEC=${AILOVE_CONFIG_RETRY_INTERVAL_SEC:?}
      - AILOVE_SNOWFLAKE_WORKER_ID=5
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=nats://nats:4222
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
    ports:
      - "8081:8081"
    depends_on: [nacos, nats]
    restart: unless-stopped
    networks: [ailove]

  extension-host:
    build: { context: .., dockerfile: deploy/Dockerfile, target: extension-host }
    image: ailove/extension-host
    container_name: ailove-extension-host
    environment:
      - AILOVE_NACOS_ADDRS=nacos:8848
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_GRPC_TIMEOUT_MS=${AILOVE_NACOS_GRPC_TIMEOUT_MS:?}
      - AILOVE_CONFIG_RETRY_COUNT=${AILOVE_CONFIG_RETRY_COUNT:?}
      - AILOVE_CONFIG_RETRY_INTERVAL_SEC=${AILOVE_CONFIG_RETRY_INTERVAL_SEC:?}
      - AILOVE_SNOWFLAKE_WORKER_ID=7
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=nats://nats:4222
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
    depends_on: [nacos, nats, mcp]
    restart: unless-stopped
    networks: [ailove]

  mcp:
    build: { context: .., dockerfile: deploy/Dockerfile, target: mcp }
    image: ailove/mcp
    container_name: ailove-mcp
    environment:
      - QWEATHER_API_KEY=${QWEATHER_API_KEY:?}
      - QWEATHER_API_HOST=${QWEATHER_API_HOST:?}
    expose:
      - "8011"
    restart: unless-stopped
    networks: [ailove]

  memory:
    build: { context: .., dockerfile: deploy/Dockerfile, target: memory }
    image: ailove/memory
    container_name: ailove-memory
    volumes:
      - /opt/ailove/data:/app/data
    environment:
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:?}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:?}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:?}
      - AILOVE_NACOS_ADDRS=nacos:8848
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_GRPC_TIMEOUT_MS=${AILOVE_NACOS_GRPC_TIMEOUT_MS:?}
      - AILOVE_CONFIG_RETRY_COUNT=${AILOVE_CONFIG_RETRY_COUNT:?}
      - AILOVE_CONFIG_RETRY_INTERVAL_SEC=${AILOVE_CONFIG_RETRY_INTERVAL_SEC:?}
      - AILOVE_SNOWFLAKE_WORKER_ID=8
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=nats://nats:4222
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
      - AILOVE_DATABASE_URL=postgresql://ailove:${AILOVE_POSTGRES_PASSWORD}@postgres:5432/ailove
      - AILOVE_DATABASE_POOL_MIN_SIZE=${AILOVE_DATABASE_POOL_MIN_SIZE:?}
      - AILOVE_DATABASE_POOL_MAX_SIZE=${AILOVE_DATABASE_POOL_MAX_SIZE:?}
      - AILOVE_DATABASE_POOL_RECYCLE_SEC=${AILOVE_DATABASE_POOL_RECYCLE_SEC:?}
      - AILOVE_DATABASE_POOL_TIMEOUT_SEC=${AILOVE_DATABASE_POOL_TIMEOUT_SEC:?}
    depends_on:
      nacos: { condition: service_started }
      nats: { condition: service_started }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [ailove]

volumes:
  nacos-data:
  postgres-data:
  nats-data:

networks:
  ailove:
    driver: bridge
