apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      hostNetwork: true
      nodeSelector:
        ailove.role: app
      containers:
      - name: mcp
        image: ailove/mcp:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: ailove-secrets
        env:
        - name: AILOVE_BUS_URL
          value: nats://127.0.0.1:14222
        - name: AILOVE_CONFIG_DIRECTORY
          value: /app/config
        - name: AILOVE_CONFIG_SECRET_DIRECTORY
          value: /app/config-secrets
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 192Mi
        volumeMounts:
        - name: plugin-state
          mountPath: /app/data/plugins
        - name: runtime-config
          mountPath: /app/config
          readOnly: true
