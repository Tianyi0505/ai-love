apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      hostNetwork: true
      nodeSelector:
        ailove.role: app
      containers:
        - name: gateway
          image: ailove/gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ailove-secrets
          env:
            - name: AILOVE_SNOWFLAKE_WORKER_ID
              value: "1"
            - name: AILOVE_NACOS_ADDRS
              value: 127.0.0.1:18848
            - name: AILOVE_NACOS_GROUP
              value: DEFAULT_GROUP
            - name: AILOVE_NACOS_GRPC_TIMEOUT_MS
              value: "5000"
            - name: AILOVE_CONFIG_RETRY_COUNT
              value: "5"
            - name: AILOVE_CONFIG_RETRY_INTERVAL_SEC
              value: "2"
            - name: AILOVE_BUS_URL
              value: nats://127.0.0.1:14222
            - name: AILOVE_DATABASE_POOL_MIN_SIZE
              value: "1"
            - name: AILOVE_DATABASE_POOL_MAX_SIZE
              value: "10"
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          hostPath:
            path: /opt/ailove/data
            type: Directory
---
