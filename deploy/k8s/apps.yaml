apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      hostNetwork: true
      nodeSelector:
        ailove.role: app
      containers:
      - name: gateway
        image: ailove/gateway:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: ailove-secrets
        env:
        - name: AILOVE_CONFIG_RETRY_COUNT
          value: '5'
        - name: AILOVE_CONFIG_RETRY_INTERVAL_SEC
          value: '2'
        - name: AILOVE_SNOWFLAKE_WORKER_ID
          value: '1'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://jaeger:4317
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: OTEL_SDK_DISABLED
          value: 'true'
        - name: AILOVE_BUS_URL
          value: nats://127.0.0.1:14222
        - name: AILOVE_DATABASE_POOL_MIN_SIZE
          value: '1'
        - name: AILOVE_DATABASE_POOL_MAX_SIZE
          value: '10'
        - name: AILOVE_DATABASE_POOL_RECYCLE_SEC
          value: '300'
        - name: AILOVE_DATABASE_POOL_TIMEOUT_SEC
          value: '30'
        - name: AILOVE_CONFIG_DIRECTORY
          value: /app/config
        - name: AILOVE_CONFIG_SECRET_DIRECTORY
          value: /app/config-secrets
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: runtime-config
          mountPath: /app/config
          readOnly: true
        - name: runtime-config-secrets
          mountPath: /app/config-secrets
          readOnly: true
      volumes:
      - name: data
        hostPath:
          path: /opt/ailove/data
          type: Directory
      - name: runtime-config
        configMap:
          name: ailove-config
      - name: runtime-config-secrets
        secret:
          secretName: ailove-config-secrets
      dnsPolicy: ClusterFirstWithHostNet
---
