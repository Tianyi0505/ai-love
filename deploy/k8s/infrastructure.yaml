apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        ailove.role: core
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - --save
        - ''
        - --appendonly
        - 'no'
        - --requirepass
        - $(AILOVE_REDIS_PASSWORD)
        env:
        - name: AILOVE_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ailove-secrets
              key: AILOVE_REDIS_PASSWORD
        ports:
        - name: redis
          containerPort: 6379
          hostPort: 16379
          hostIP: 127.0.0.1
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: monitor
    port: 8222
    targetPort: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      nodeSelector:
        ailove.role: core
      containers:
      - name: nats
        image: nats:2.10.29-alpine
        imagePullPolicy: IfNotPresent
        args:
        - -js
        - -sd
        - /data
        - -m
        - '8222'
        - -auth
        - $(AILOVE_BUS_TOKEN)
        env:
        - name: AILOVE_BUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ailove-secrets
              key: AILOVE_BUS_TOKEN
        ports:
        - name: client
          containerPort: 4222
          hostPort: 4222
        - name: monitor
          containerPort: 8222
        readinessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: /opt/ailove/k8s-data/nats
          type: Directory
