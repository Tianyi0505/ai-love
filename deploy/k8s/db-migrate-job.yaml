apiVersion: batch/v1
kind: Job
metadata:
  name: ailove-dbmigrate
  namespace: ailove
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      hostNetwork: true
      nodeSelector:
        ailove.role: app
      restartPolicy: Never
      containers:
        - name: dbmigrate
          image: ailove/gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ailove-secrets
          env:
          command:
            - sh
            - -c
            - |
              python -m alembic -c alembic.ini upgrade head && echo MIGRATION-DONE
