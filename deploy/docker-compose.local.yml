# 部署本地直播服务

services:
  live-edge:
    image: ailove/live-edge
    container_name: ailove-live-edge-local
    environment:
      - AILOVE_NACOS_ADDRS=${AILOVE_NACOS_ADDRS:?}
      - AILOVE_NACOS_GROUP=${AILOVE_NACOS_GROUP:?}
      - AILOVE_NACOS_USER=${AILOVE_NACOS_USER:?}
      - AILOVE_NACOS_PASSWORD=${AILOVE_NACOS_PASSWORD:?}
      - AILOVE_BUS_URL=${AILOVE_BUS_URL:?}
      - AILOVE_BUS_TOKEN=${AILOVE_BUS_TOKEN:?}
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks: [ailove]

  gpt-sovits:
    image: ${GPT_SOVITS_IMAGE:?}   # 必须显式给出明确 tag/digest（ghcr 需登录），禁止 latest
    container_name: ailove-gpt-sovits
    environment:
      - GPT_SOVITS_URL=http://127.0.0.1:9880
    ports:
      - "9880:9880"
    volumes:
      - ./sounds:/sounds
    restart: unless-stopped
    networks: [ailove]

networks:
  ailove:
    driver: bridge
