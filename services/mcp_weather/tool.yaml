server:
  name: qweather
  version: 1.0.0
  instructions: 查询和风天气的实时天气和每日预报。数据来自 QWeather。
  transport: streamable-http
  host: 0.0.0.0
  port: 8011
  json_response: true
  stateless_http: true
weather:
  name: weather
  title: 查询天气
  description: 查询指定地点的实时天气及未来每日预报。
  city:
    min_length: 1
    description: 城市、地区、LocationID 或经纬度
  days:
    min: 1
    max: 10
    default: 3
    description: 预报天数，1 到 10 天
  lang:
    min_length: 2
    max_length: 10
    default: zh
    description: 返回语言
client:
  request_timeout_sec: 10
