<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI-Love Live2D</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
// 接收动作指令并驱动 Live2D
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (e) => {
  const cmd = JSON.parse(e.data);
  // 将动作指令映射为 Live2D 动画
  console.log("[live2d]", cmd);
};
ws.onopen = () => console.log("[live2d] WS connected");
</script>
</body>
</html>
