weather:
  name: weather
  title: 查询天气
  description: 查询指定地点的实时天气及未来每日预报。
  city:
    min_length: 1
    description: 城市、地区、LocationID 或经纬度
  days:
    min: 1
    max: 10
    default: 3
    description: 预报天数，1 到 10 天
  lang:
    min_length: 2
    max_length: 10
    default: zh
    description: 返回语言
client:
  request_timeout_sec: 10
  accept_encoding: gzip
  location_result_limit: 1
  coordinate_precision: 2
  percent_multiplier: 100
