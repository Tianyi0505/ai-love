weather:
  name: weather
  title: Weather
  description: Get current weather and daily forecasts for a location.
  city:
    min_length: 1
    description: City, region, LocationID, or coordinates.
  days:
    min: 1
    max: 10
    default: 3
    description: Forecast days from 1 to 10.
  lang:
    min_length: 2
    max_length: 10
    default: zh
    description: Result language.
client:
  request_timeout_sec: 10
  accept_encoding: gzip
  location_result_limit: 1
  coordinate_precision: 2
  percent_multiplier: 100
