web_search:
  name: web_search
  title: Web Search
  description: Search current web information, facts, and news.
  query_description: Search terms.
  query_min_length: 1
  query_max_length: 200
  request_timeout_sec: 10
  endpoint: https://www.bing.com/search
  user_agent: Mozilla/5.0
  result_limit: 5
  messages:
    no_result: No result for "${query}".
    result: |-
      [${index}] ${title}
      ${url}
      ${snippet}
