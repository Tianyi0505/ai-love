[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-love-runtime"
version = "0.1.0"
requires-python = ">=3.11"

[project.entry-points."ai_love.tts"]
gptsovits = "agent.speech.gpt_sovits_provider:GPTSoVITSProvider"

[project.entry-points."ai_love.gptsovits"]
gptsovits = "gptsovits.gpt_sovits_engine:GPTSoVITSEngine"
mimo = "gptsovits.mimo_engine:MimoEngine"

[project.entry-points."ai_love.channels"]
qq = "gateway.qq_channel:QQChannel"

[project.entry-points."ai_love.content_strategies"]
quote = "gateway.content_type_resolver:QuoteStrategy"
forward = "gateway.content_type_resolver:ForwardStrategy"
voice = "gateway.content_type_resolver:VoiceStrategy"
image = "gateway.content_type_resolver:ImageStrategy"
file = "gateway.content_type_resolver:FileStrategy"
at = "gateway.content_type_resolver:AtStrategy"
text = "gateway.content_type_resolver:TextStrategy"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["admin"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
